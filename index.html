<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5d3b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Football Coach">
<title>Football Coach — Full Speed O23</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css?v=5.0.0">
</head>
<body>
<div class="app-shell">
<aside class="sidebar">
  <div class="brand"><div class="brand-mark">FS</div><div><strong>Full Speed O23</strong><span>Football Coach</span></div></div>
  <nav id="sideNav" class="side-nav" aria-label="Hoofdnavigatie">
    <button data-page="dashboard">⌂ <span>Vandaag</span></button>
    <button data-page="players">♙ <span>Teams & spelers</span></button>
    <button data-page="attendance">✓ <span>Aanwezigheid</span></button>
    <button data-page="trainings">◫ <span>Trainingen</span></button>
    <button data-page="exercises">▦ <span>Oefeningen</span></button>
    <button data-page="matches">⚽ <span>Wedstrijden</span></button>
    <button data-page="tactics">↗ <span>Tactiekbord</span></button>
    <button data-page="gamemodel">◆ <span>Spelmodel</span></button>
    <button data-page="season">▣ <span>Seizoen</span></button>
    <button data-page="stats">▥ <span>Statistieken</span></button>
    <button data-page="notes">✎ <span>Coachnotities</span></button>
    <button data-page="documents">⌁ <span>Bronnen</span></button>
    <button data-page="settings">⚙ <span>Instellingen</span></button>
  </nav>
  <div class="sidebar-foot"><span class="dot"></span><span id="saveState">Lokaal opgeslagen</span></div>
</aside>
<main class="main-area">
<header class="topbar">
  <div><p id="eyebrow" class="eyebrow">SEIZOEN 2026/2027</p><h1 id="title">Vandaag</h1></div>
  <div class="top-actions"><select id="teamSelect" class="team-select"></select><button id="quickAdd" class="icon-btn" title="Snel toevoegen">＋</button></div>
</header>
<section id="app" class="content"></section>
</main>
</div>
<nav class="bottom-nav" id="bottomNav">
  <button data-page="dashboard">⌂<small>Vandaag</small></button>
  <button data-page="players">♙<small>Team</small></button>
  <button data-page="matches">⚽<small>Wedstrijden</small></button>
  <button data-page="stats">▥<small>Statistieken</small></button>
  <button data-page="more">•••<small>Meer</small></button>
</nav>
<dialog id="modal"><form method="dialog" class="modal-card"><div class="modal-head"><h2 id="modalTitle"></h2><button value="cancel" class="icon-btn">×</button></div><div id="modalBody"></div><div class="modal-actions"><button value="cancel" class="btn ghost">Annuleren</button><button id="modalSave" value="default" class="btn primary">Opslaan</button></div></form></dialog>
<div id="toast" class="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="app.js?v=5.0.0"></script>
</body></html>
